{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema PPC{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'ppc/style.css' %}">
    {{ form.media }}
</head>
<body>
    <nav class="menu-principal">
        <a href="{% url 'home' %}">Início</a>
        <a href="{% url 'lista_cursos' %}">Cursos</a>
        {% if user.is_staff %}
            <a href="{% url 'gestao_usuarios' %}">Gerenciar Usuários</a>
        {% endif %}
        <a href="{% url 'ajuda' %}">Ajuda</a>
    </nav>
    <main id="conteudo-principal">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
