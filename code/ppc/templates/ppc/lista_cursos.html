{% extends "base.html" %}
{% block title %}Cursos{% endblock %}
{% block content %}
    <h1>Cursos</h1>
    <a href="{% url 'criar_curso' %}" class="btn btn-primario">+ Novo Curso</a>
    <ul class="lista-cursos">
    {% for curso in cursos %}
        <li class="card">
            <h2 class="card-titulo">{{ curso.nome }}</h2>
            <p class="card-corpo">{{ curso.unidade_academica }}</p>
            <a href="{% url 'detalhe_curso' curso.id %}" class="btn btn-primario">Ver PPCs</a>
        </li>
    {% empty %}
        <li>Nenhum curso cadastrado ainda.</li>
    {% endfor %}
</ul>
{% endblock %}
