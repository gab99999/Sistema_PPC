{% extends "ppc_base.html" %}
{% block title %}Trabalho de Conclusão de Curso — {{ ppc.curso.nome }}{% endblock %}
{% block ppc_content %}
    <h2>Trabalho de Conclusão de Curso</h2>
    <form method="post" class="form-secao">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primario">Salvar</button>
    </form>
{% endblock %}
