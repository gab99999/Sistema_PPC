{% extends "ppc_base.html" %}
{% block title %}Editar Bibliografia{% endblock %}
{% block ppc_content %}
    <a href="{% url 'detalhe_componente' componente.id %}" class="link-voltar">← Voltar para {{ componente.nome }}</a>
    <h2>Editar Bibliografia</h2>
    <form method="post" class="form-secao">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primario">Salvar</button>
    </form>
{% endblock %}
