{% if fluxograma %}
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 {{ fluxograma.largura }} {{ fluxograma.altura }}"
     {% if tamanho_fixo %}width="{{ fluxograma.largura }}" height="{{ fluxograma.altura }}"{% else %}width="100%"{% endif %}
     font-family="Arial, Helvetica, sans-serif">
  {% for c in fluxograma.colunas %}
    <text x="{{ c.x|add:6 }}" y="18" font-size="11" font-weight="bold">{{ c.rotulo }}</text>
  {% endfor %}

  {% for e in fluxograma.arestas %}
    <path d="{{ e.path }}" fill="none" stroke="{{ e.cor }}" stroke-width="1.4"{% if e.tracejada %} stroke-dasharray="5 4"{% endif %}/>
    {% if e.seta %}<polygon points="{{ e.seta }}" fill="{{ e.cor }}"/>{% endif %}
  {% endfor %}

  {% for b in fluxograma.caixas %}
    <g>
      <title>{{ b.nome_completo }}</title>
      <rect x="{{ b.x }}" y="{{ b.y }}" width="{{ b.w }}" height="{{ b.h }}" rx="4"
            fill="{{ b.fill }}" stroke="#334155" stroke-width="1"{% if b.tracejada %} stroke-dasharray="4 3"{% endif %}/>
      <text x="{{ b.x|add:6 }}" y="{{ b.cab_y }}" font-size="9" font-weight="bold">{{ b.cabecalho }}</text>
      {% for l in b.linhas %}
        <text x="{{ b.x|add:6 }}" y="{{ l.y }}" font-size="8.5">{{ l.t }}</text>
      {% endfor %}
    </g>
  {% endfor %}
</svg>
{% endif %}
