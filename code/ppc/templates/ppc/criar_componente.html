{% extends "ppc_base.html" %}
{% block title %}Novo Componente — {{ ppc.curso.nome }}{% endblock %}
{% block ppc_content %}
    <h2>Novo Componente Curricular</h2>
    <form method="post" class="form-secao">
        {% csrf_token %}
        <h3>Dados do Componente</h3>
        {{ form_componente.as_p }}
        <h3>Vínculo com este PPC</h3>
        {{ form_vinculo.as_p }}
        <button type="submit" class="btn btn-primario">Salvar</button>
    </form>

    <script>
    (() => {
        const camposPadrao = ['carga_horaria_teorica', 'carga_horaria_pratica', 'carga_horaria_pcc'];
        const camposAtividade = ['carga_horaria_estudante', 'carga_horaria_professor'];
        const camposAcex = ['carga_horaria_acex'];

        function linhaDoCampo(nomeCampo) {
            const campo = document.getElementById(`id_${nomeCampo}`);
            return campo ? campo.closest('p') : null;
        }

        const tipoSelect = document.getElementById('id_tipo');
        const nucleoSelect = document.getElementById('id_nucleo');

        function alternar() {
            const ehAtividade = tipoSelect.value === 'atividade';
            const ehAcex = nucleoSelect.value === 'ACEx';
            camposPadrao.forEach(nome => { const p = linhaDoCampo(nome); if (p) p.hidden = ehAtividade || ehAcex; });
            camposAtividade.forEach(nome => { const p = linhaDoCampo(nome); if (p) p.hidden = !ehAtividade; });
            camposAcex.forEach(nome => { const p = linhaDoCampo(nome); if (p) p.hidden = !ehAcex; });
        }

        tipoSelect.addEventListener('change', alternar);
        nucleoSelect.addEventListener('change', alternar);
        alternar();
    })();
    </script>
{% endblock %}
